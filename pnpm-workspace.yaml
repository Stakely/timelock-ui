# Supply-chain quarantine: never install a version published less than 7 days
# ago (10080 minutes). Gives npm/GHSA a window to pull a compromised release
# before it reaches our lockfile.
#
# Expected side effect: `pnpm outdated` will list packages that are merely in
# quarantine, not unmaintained. That's the policy working, not a failure.
#
# Requires pnpm >= 11.18.0 (see `packageManager` in package.json and the
# pnpm/action-setup pin in .github/workflows/ci.yml). Earlier versions abort
# with ERR_PNPM_MISSING_TIME on packages with large metadata documents
# (es-toolkit, @solana/*, vitest): they fetch the registry's abbreviated
# metadata, which omits the `time` field this filter reads.
minimumReleaseAge: 10080

# Si a un paquete le falta el campo "time", fallar en vez de saltarse la
# comprobacion en silencio con un WARN (que es el default, `true`).
#
# Contrapartida asumida: esto es fail-closed, asi que un registry que sirva
# metadata recortado sin "time" rompe el install en vez de dejarlo pasar sin
# comprobar. Con registry.npmjs.org no ocurre, porque pnpm se descarga el
# documento completo cuando el abreviado no lo trae. Si algun dia se instala
# desde un mirror o un registro privado (Verdaccio, Artifactory) y los installs
# empiezan a fallar por esto, la solucion es arreglar el mirror para que sirva
# "time", no poner esta opcion en `true`.
minimumReleaseAgeIgnoreMissingTime: false

# Pin paulmillr's `qr` to 0.5.5. Newer versions (0.6.0 at time of writing)
# reject `border=0`, which is what RainbowKit's `cuer` dependency passes when
# rendering the WalletConnect QR. Result: "Uncaught Error: invalid border=0"
# in the connect modal. Until cuer/rainbowkit adapt to the new qr API, hold
# the working version.
overrides:
  qr: 0.5.5
  # Memory-exhaustion DoS from tiny fragments, plus uninitialized memory
  # disclosure, in ws 8.x. viem/walletconnect pull in 8.18.0. The range leaves
  # the 7.x line alone: 7.5.13 is already patched and
  # @walletconnect/jsonrpc-ws-connection doesn't support ws 8.
  ws@>=8.0.0 <8.21.0: ^8.21.1
  # Nine advisories against axios <1.18.0 (inherited proxy in the Node adapter,
  # prototype pollution, runaway recursion in formDataToJSON). Reaches us
  # through @coinbase/cdp-sdk.
  axios: ^1.18.1
  # Bounds check ausente en uuid v3/v5/v6. El selector alcanza 5 dependientes,
  # todos bajo rainbowkit > wagmi > @wagmi/connectors: @metamask/sdk y
  # @metamask/sdk-communication-layer (declaran ^8.3.2), y @metamask/utils
  # 8.5.0 / 9.3.0 / 11.11.0 (declaran ^9.0.1), que entran por tres caminos:
  # @metamask/rpc-errors > @gemini-wallet/core, @coinbase/wallet-sdk y
  # @metamask/providers. El lockfile queda con una unica copia, 11.1.1.
  uuid@<11.1.1: ^11.1.1
  # PostCSS: parche incompleto de GHSA-6g55-p6wh-862q, y nanoid: los
  # generadores personalizados pueden entrar en bucle. Ambos via vite.
  postcss@<8.5.23: ^8.5.23
  nanoid@<3.3.18: ^3.3.18
  # Cinco avisos contra undici 7.x, uno de ellos high (fuga de informacion
  # entre usuarios). Solo dev: llega via jsdom.
  undici@>=7.0.0 <7.29.0: ^7.29.0
  # Siete avisos contra hono <4.12.34: ReDoS en el middleware CORS, fuga de
  # SSR entre peticiones en memo(), DoS en el middleware de idioma y mas.
  # Llega via rainbowkit > wagmi > porto.
  hono@<4.12.34: ^4.12.34
  # DoS por arrays intermedios sin limite. Hoy solo aplica a la 5.x, que entra
  # por eslint > minimatch@10 (dev). Las ramas 1.x y 2.x no estan en el arbol,
  # pero se cubren igualmente: si mañana entra un glob o un minimatch@3 que
  # declare ^1.1.x o ^2.x, el selector de la 5.x no lo alcanzaria y volveria a
  # colarse una version vulnerable. Cada rango sube dentro de su propio major,
  # asi que no puede colar un cambio de API. La 3.x no aparece en ningun rango
  # vulnerable de los avisos actuales, por eso no lleva entrada.
  brace-expansion@<1.1.17: ^1.1.18
  brace-expansion@>=2.0.0 <2.1.4: ^2.1.4
  brace-expansion@>=4.0.0 <5.0.9: ^5.0.9

# No forzar decode-uri-component. El aviso (moderate, DoS por decodificacion
# exponencial) pide >=0.4.3, version que no existe: el unico parche es 0.5.0,
# y esa es ESM pura ("type": "module"). query-string@7.1.3 --que es quien la
# usa, via @walletconnect/utils-- la carga con require(), asi que en 0.5.0
# recibe el namespace del modulo en vez de la funcion y revienta con
# "decodeComponent is not a function" al parsear cualquier query string.
# Comprobado: el build de vite y los 64 tests pasan igualmente, el fallo solo
# sale al ejecutar query-string. Revisar cuando walletconnect suba a
# query-string 8+, que ya usa la API nueva.
#
# Aviso: GHSA-vcc3-ghjq-m6fr (CVE-2026-45822). Ojo al leerlo, porque pnpm audit
# dice "patched >=0.4.3" y esa version no existe: las publicadas son 0.1.0-0.4.1
# y 0.5.0, y el GHSA lista 0.5.0 como el parche real.
#
# La version instalada hoy es 0.2.2, no 0.4.1: query-string declara ^0.2.2 y es
# lo que resuelve. El 0.4.1 que se cita arriba es solo la ultima vulnerable
# publicada, util para entender el salto, no lo que hay en el lockfile.

# Explicitly deny build scripts for optional native modules pulled in by ws and
# keccak transitives. They all have pure-JS fallbacks and we don't need the
# compiled versions for a browser UI. This silences ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  bufferutil: false
  keccak: false
  utf-8-validate: false
